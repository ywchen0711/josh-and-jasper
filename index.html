<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Josh &amp; Jasper: Coyote Trail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="wrap">
    <canvas id="screen" width="320" height="192"></canvas>
    <!-- 觸控按鈕 (手機) -->
    <div id="touch" hidden>
      <div class="pad-left">
        <button data-key="left" aria-label="Left">◀</button>
        <button data-key="down" aria-label="Down">▼</button>
        <button data-key="right" aria-label="Right">▶</button>
      </div>
      <div class="pad-right">
        <button data-key="dash" aria-label="Dash">»</button>
        <button data-key="toss" aria-label="Throw">●</button>
        <button data-key="jump" aria-label="Jump">▲</button>
      </div>
    </div>
  </div>
  <p class="help">
    <b>Josh</b>: A / D move · W jump &amp; climb · S down · F throw · Left Shift dash &nbsp;|&nbsp;
    <b>Jasper</b>: ← / → move · ↑ jump (twice = double jump) &amp; climb · ↓ down · / throw<br>
    1 player: either key set, plus Space / Z jump · X throw · C dash &nbsp;·&nbsp; Enter start · P pause · M sound
  </p>

  <script src="js/art.js?v=4"></script>
  <script src="js/art-world.js?v=4"></script>
  <script src="js/levels.js?v=4"></script>
  <script src="js/sound.js?v=4"></script>
  <script src="js/game.js?v=4"></script>
</body>
</html>
